name: Publish SM Sourcing Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Locate or install WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # GitHub's Windows runner may already contain WiX. Reuse it instead
          # of asking Chocolatey to downgrade/reinstall an existing version.
          $wixBin = $null
          $knownPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.14\bin",
            "C:\Program Files\WiX Toolset v3.11\bin"
          )

          foreach ($candidate in $knownPaths) {
            if ((Test-Path (Join-Path $candidate "candle.exe")) -and
                (Test-Path (Join-Path $candidate "light.exe"))) {
              $wixBin = $candidate
              break
            }
          }

          if (-not $wixBin) {
            Write-Host "WiX was not found; installing WiX Toolset 3.14.1."
            choco install wixtoolset --version=3.14.1 --yes --no-progress

            foreach ($candidate in $knownPaths) {
              if ((Test-Path (Join-Path $candidate "candle.exe")) -and
                  (Test-Path (Join-Path $candidate "light.exe"))) {
                $wixBin = $candidate
                break
              }
            }
          }

          if (-not $wixBin) {
            $found = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object {
                (Test-Path (Join-Path $_ "candle.exe")) -and
                (Test-Path (Join-Path $_ "light.exe"))
              } |
              Select-Object -First 1

            if ($found) {
              $wixBin = $found
            }
          }

          if (-not $wixBin) {
            throw "WiX Toolset was not found. candle.exe and light.exe are required."
          }

          "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "WIX=$wixBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Using WiX Toolset from: $wixBin"
          Write-Host "candle.exe: $(Test-Path (Join-Path $wixBin 'candle.exe'))"
          Write-Host "light.exe: $(Test-Path (Join-Path $wixBin 'light.exe'))"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.3' }}
          releaseName: "SM Sourcing v${{ github.ref_type == 'tag' && github.ref_name || '0.1.3' }}"
          releaseBody: "SM Sourcing Desktop release. Download the Windows MSI installer from the assets below."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
