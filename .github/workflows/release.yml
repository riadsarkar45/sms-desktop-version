name: Publish SM Sourcing Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset 3.14.1
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 --yes --no-progress

          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"

          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            $candidate = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
              Select-Object -First 1

            if (-not $candidate) {
              throw "WiX Toolset installation completed, but candle.exe was not found."
            }

            $wixBin = $candidate
          }

          if (-not (Test-Path (Join-Path $wixBin "light.exe"))) {
            throw "WiX light.exe was not found in $wixBin"
          }

          "$wixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "WIX=$wixBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "WiX installed at: $wixBin"
          & (Join-Path $wixBin "candle.exe") -? | Select-Object -First 2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.3' }}
          releaseName: "SM Sourcing v${{ github.ref_type == 'tag' && github.ref_name || '0.1.3' }}"
          releaseBody: "SM Sourcing Desktop release. Download the Windows MSI installer from the assets below."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
