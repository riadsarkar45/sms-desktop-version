name: Publish SM Sourcing Desktop

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set Tauri WiX cache directory
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:LOCALAPPDATA "tauri\WixTools314"
          "TAURI_WIX_CACHE=$wixDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Tauri WiX cache: $wixDir"

      - name: Restore WiX cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TAURI_WIX_CACHE }}
          key: tauri-wix-3.14.1-windows-x64-v1

      - name: Pre-download WiX binaries into Tauri cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wixDir = $env:TAURI_WIX_CACHE
          $candle = Join-Path $wixDir "candle.exe"
          $light = Join-Path $wixDir "light.exe"

          if (-not ((Test-Path $candle) -and (Test-Path $light))) {
            New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
            $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
            $downloaded = $false

            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Write-Host "Downloading WiX binaries (attempt $attempt of 5)..."
                Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 180
                $downloaded = $true
                break
              }
              catch {
                Write-Warning "Download attempt $attempt failed: $_"
                if ($attempt -lt 5) { Start-Sleep -Seconds 12 }
              }
            }

            if (-not $downloaded) {
              throw "WiX download failed after 5 attempts."
            }

            Expand-Archive -LiteralPath $zip -DestinationPath $wixDir -Force
            Remove-Item -LiteralPath $zip -Force

            $nestedCandle = Get-ChildItem -Path $wixDir -Recurse -Filter candle.exe |
              Select-Object -First 1
            if (-not $nestedCandle) { throw "candle.exe was not found after extraction." }

            if ($nestedCandle.DirectoryName -ne $wixDir) {
              Copy-Item -Path (Join-Path $nestedCandle.DirectoryName "*") -Destination $wixDir -Recurse -Force
            }
          }

          if (-not ((Test-Path $candle) -and (Test-Path $light))) {
            throw "WiX cache is missing candle.exe or light.exe."
          }
          Write-Host "WiX binaries are ready in Tauri's expected cache."

      - name: Validate all application versions
        id: app_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/release.js check "$env:GITHUB_REF_NAME"
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Building SM Sourcing v$version"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}
          releaseName: "SM Sourcing ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.app_version.outputs.version) }}"
          releaseBody: "SM Sourcing Desktop release. Download the Windows MSI installer from the assets below."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
